[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delay-intelligence"
version = "0.1.0"
description = "Supply Chain Delay Intelligence: Multi-Task Predictive, Conformal Uncertainty, and Prescriptive Causal System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Supply Chain Intelligence Team" }
]
keywords = [
    "supply-chain",
    "delay-prediction",
    "conformal-prediction",
    "causal-inference",
    "prescriptive-analytics",
    "risk-management",
]

# Stage 0 Minimal Baseline Dependencies
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Stage 0 Development & Testing Tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

# Stage 1-3 Data Ingestion, Validation & Schema Contracts
data = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "pandera>=0.17.0",
    "pydantic>=2.0.0",
]

# Stage 4-6 Feature Engineering, Evaluation & ML Modeling
ml = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "xgboost>=1.7.0",
    "optuna>=3.2.0",
    "joblib>=1.3.0",
]

# Stage 6 Deep Learning Tabular Baselines
dl = [
    "torch>=2.0.0",
]

# Stage 7 Uncertainty Quantification & Conformal Prediction
uncertainty = [
    "mapie>=0.6.0",
    "scikit-learn>=1.3.0",
]

# Stage 8 Causal Inference & Attribution
causal = [
    "dowhy>=0.10.0",
    "econml>=0.14.0",
    "networkx>=3.0",
    "shap>=0.42.0",
    "matplotlib>=3.7.0",
]

# Stage 9 Prescriptive Decision Engine & Optimization
decision = [
    "scipy>=1.11.0",
]

# Stage 10 Serving REST API
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

# Stage 10 Interactive Analytics Dashboard
dashboard = [
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
]

# Complete Environment (All Stages)
all = [
    "delay-intelligence[dev,data,ml,dl,uncertainty,causal,decision,api,dashboard]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/delay_intelligence"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
