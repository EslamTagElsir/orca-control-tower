<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="270" viewBox="0 0 1300 270" role="img" aria-labelledby="t d">
<title id="t">ORCA decision workflow</title><desc id="d">Operational data passes through prediction, severity estimation, explanation, simulation, and human decision.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#14243A"/></linearGradient></defs>
<rect width="1300" height="270" rx="22" fill="url(#bg)"/>
<text x="35" y="40" fill="#F8FAFC" font-size="21" font-weight="700" font-family="Inter,Arial">From operational data to a human decision</text>
<text x="35" y="64" fill="#94A3B8" font-size="13" font-family="Inter,Arial">Model evidence informs the workflow; the operator remains responsible for the decision.</text>
<g><rect x="35" y="88" width="175" height="112" rx="16" fill="#15243A" stroke="#2DD4BF" stroke-opacity=".7" stroke-width="2"/><circle cx="60" cy="113" r="13" fill="#2DD4BF"/><text x="60" y="118" text-anchor="middle" fill="#07111F" font-size="12" font-weight="800" font-family="Inter,Arial">1</text><text x="122" y="145" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Inter,Arial">Operational data</text><text x="122" y="169" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Shipment features</text></g><path d="M214 144 H234 l-7 -6 m7 6 l-7 6" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="240" y="88" width="175" height="112" rx="16" fill="#15243A" stroke="#2DD4BF" stroke-opacity=".7" stroke-width="2"/><circle cx="265" cy="113" r="13" fill="#2DD4BF"/><text x="265" y="118" text-anchor="middle" fill="#07111F" font-size="12" font-weight="800" font-family="Inter,Arial">2</text><text x="327" y="145" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Inter,Arial">Predict</text><text x="327" y="169" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Late-risk score</text></g><path d="M419 144 H439 l-7 -6 m7 6 l-7 6" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="445" y="88" width="175" height="112" rx="16" fill="#15243A" stroke="#2DD4BF" stroke-opacity=".7" stroke-width="2"/><circle cx="470" cy="113" r="13" fill="#2DD4BF"/><text x="470" y="118" text-anchor="middle" fill="#07111F" font-size="12" font-weight="800" font-family="Inter,Arial">3</text><text x="532" y="145" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Inter,Arial">Estimate</text><text x="532" y="169" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Delay + interval</text></g><path d="M624 144 H644 l-7 -6 m7 6 l-7 6" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="650" y="88" width="175" height="112" rx="16" fill="#15243A" stroke="#2DD4BF" stroke-opacity=".7" stroke-width="2"/><circle cx="675" cy="113" r="13" fill="#2DD4BF"/><text x="675" y="118" text-anchor="middle" fill="#07111F" font-size="12" font-weight="800" font-family="Inter,Arial">4</text><text x="737" y="145" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Inter,Arial">Explain</text><text x="737" y="169" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Local SHAP drivers</text></g><path d="M829 144 H849 l-7 -6 m7 6 l-7 6" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="855" y="88" width="175" height="112" rx="16" fill="#15243A" stroke="#2DD4BF" stroke-opacity=".7" stroke-width="2"/><circle cx="880" cy="113" r="13" fill="#2DD4BF"/><text x="880" y="118" text-anchor="middle" fill="#07111F" font-size="12" font-weight="800" font-family="Inter,Arial">5</text><text x="942" y="145" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Inter,Arial">Simulate</text><text x="942" y="169" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Compare scenarios</text></g><path d="M1034 144 H1054 l-7 -6 m7 6 l-7 6" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="1060" y="88" width="175" height="112" rx="16" fill="#15243A" stroke="#FBBF24" stroke-opacity=".7" stroke-width="2"/><circle cx="1085" cy="113" r="13" fill="#FBBF24"/><text x="1085" y="118" text-anchor="middle" fill="#07111F" font-size="12" font-weight="800" font-family="Inter,Arial">6</text><text x="1147" y="145" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" font-family="Inter,Arial">Decide</text><text x="1147" y="169" text-anchor="middle" fill="#B9C7D8" font-size="12" font-family="Inter,Arial">Human operator</text></g>
<text x="1265" y="248" text-anchor="end" fill="#64748B" font-size="11" font-family="Inter,Arial">CONCEPTUAL SYSTEM FLOW</text></svg>