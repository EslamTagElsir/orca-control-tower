name: Learning Persistence QA

on:
  push:
    branches:
      - fix/learning-persistence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Complete Phase 1 wiring
        if: github.event_name == 'push'
        run: |
          python3 scripts/complete-phase1-persistence.py
          python3 scripts/finalize-phase1-integrity.py
          python3 scripts/add-resolution-hub-link.py
      - name: Format changed learning sources
        if: github.event_name == 'push'
        run: |
          bunx prettier --write \
            src/components/orca/SimShipmentDetail.tsx \
            src/lib/orca/simulation/engine.ts \
            src/lib/orca/simulation/intervention-policy.ts \
            src/lib/orca/simulation/persistence.ts \
            'src/routes/api/learning/$.ts' \
            src/routes/api/learning-audit.ts \
            src/routes/api/learning-inference.ts \
            src/routes/resolution-hub.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/orca/SimShipmentDetail.tsx \
              src/lib/orca/simulation/engine.ts \
              src/lib/orca/simulation/intervention-policy.ts \
              src/lib/orca/simulation/persistence.ts \
              'src/routes/api/learning/$.ts' \
              src/routes/api/learning-audit.ts \
              src/routes/api/learning-inference.ts \
              src/routes/resolution-hub.tsx
            git commit -m "Finalize Phase 1 HITL integrity"
            git push
          fi
      - name: Generate routes and production build
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Lint project-owned ORCA and Learning API source
        run: bunx eslint src/components/orca/SimShipmentDetail.tsx src/lib/orca src/routes/api/learning src/routes/api/learning-audit.ts src/routes/api/learning-inference.ts src/routes/resolution-hub.tsx --max-warnings 0
