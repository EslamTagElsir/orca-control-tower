name: Import ORCA backend into monorepo

on:
  push:
    branches:
      - chore/unify-backend-monorepo
    paths:
      - .github/workflows/import-backend-monorepo.yml

permissions:
  contents: write

jobs:
  import-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out control tower branch
        uses: actions/checkout@v4
        with:
          ref: chore/unify-backend-monorepo
          fetch-depth: 0

      - name: Fetch backend source
        run: |
          git clone --depth 1 https://github.com/EslamTagElsir/orca-backend.git /tmp/orca-backend
          rm -rf /tmp/orca-backend/.git
          rm -rf /tmp/orca-backend/src/delay_intelligence.egg-info

      - name: Import backend under backend directory
        run: |
          mkdir -p backend
          rsync -a --delete /tmp/orca-backend/ backend/

      - name: Verify backend runtime files
        run: |
          test -f backend/Dockerfile
          test -f backend/requirements.railway.txt
          test -f backend/pyproject.toml
          test -f backend/src/delay_intelligence/api/main.py
          test -f backend/artifacts/model_registry/v2/catboost_classifier.cbm
          test -f backend/artifacts/model_registry/v2/lightgbm_q50.txt
          echo "Imported backend files: $(find backend -type f | wc -l)"

      - name: Commit imported backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No backend changes to commit."
            exit 0
          fi
          git commit -m "Import ORCA backend into monorepo"
          git push origin HEAD:chore/unify-backend-monorepo
