name: Validate ORCA monorepo

on:
  push:
    branches:
      - chore/unify-backend-monorepo
    paths:
      - .github/workflows/validate-monorepo.yml

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Lint frontend
        run: bun run lint
      - name: Build frontend
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend runtime
        working-directory: backend
        run: pip install -r requirements.railway.txt
      - name: Import API and load model health
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from delay_intelligence.api.main import health
          payload = health()
          assert payload['status'] == 'ok', payload
          assert payload['model_version'], payload
          print(payload)
          PY
