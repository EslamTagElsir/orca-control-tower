name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend targeted lint and full build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed ORCA surface
        run: >-
          bunx eslint
          src/components/orca/AppShell.tsx
          src/lib/orca/reliability.ts
          src/lib/orca/monitoring.ts
          src/routes/model-monitor.tsx
          src/routes/monitoring-readiness.tsx
          src/routes/reports.tsx
          'src/routes/api/orca/$.ts'
          --rule 'prettier/prettier: off'

      - name: Build full frontend
        run: bun run build

  backend-contracts:
    name: Backend contracts and artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest pydantic PyYAML

      - name: Compile backend source
        run: python -m compileall -q backend/src

      - name: Run API, registry, and drift-readiness contracts
        env:
          PYTHONPATH: backend/src
        run: >-
          pytest -q
          backend/tests/test_api_schemas.py
          backend/tests/test_reliability_artifact.py
          backend/tests/test_drift_readiness_contract.py
