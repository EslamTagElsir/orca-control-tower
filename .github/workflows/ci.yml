name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, build, and container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Lovable-free build dependency graph
        run: |
          set -euo pipefail
          if grep -q '@lovable.dev/' package.json bun.lock vite.config.ts; then
            echo 'Lovable build/runtime package reference detected.'
            exit 1
          fi

      - name: Lint changed ORCA surface
        run: >-
          bunx eslint
          src/components/orca/AppShell.tsx
          src/lib/orca/reliability.ts
          src/lib/orca/monitoring.ts
          src/routes/model-monitor.tsx
          src/routes/monitoring-readiness.tsx
          src/routes/reports.tsx
          src/routes/settings.tsx
          'src/routes/api/orca/$.ts'
          --rule 'prettier/prettier: off'

      - name: Build full frontend
        run: bun run build

      - name: Build and smoke-test standalone frontend container
        run: |
          set -euo pipefail
          docker build --tag orca-frontend:ci .
          container_id=$(docker run --detach --publish 3000:3000 --env PORT=3000 --env HOST=0.0.0.0 orca-frontend:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 1 \
            http://127.0.0.1:3000/settings \
            >/dev/null; then
            echo "Frontend container failed HTTP smoke test. Container logs:"
            docker logs "$container_id" || true
            exit 1
          fi

          echo "Standalone frontend container served /settings successfully."

  backend-contracts:
    name: Backend contracts and artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest pydantic PyYAML

      - name: Compile backend source
        run: python -m compileall -q backend/src

      - name: Run API, registry, and monitoring contracts
        env:
          PYTHONPATH: backend/src
        run: >-
          pytest -q
          backend/tests/test_api_schemas.py
          backend/tests/test_reliability_artifact.py
          backend/tests/test_drift_readiness_contract.py
          backend/tests/test_production_monitoring_contract.py
